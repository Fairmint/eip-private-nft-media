# Publish @fairmint/eip-private-nft-media to npm from main.
#
# Every push to main builds, checks, picks the next free version
# (scripts/prepare-release.mjs), publishes it with npm Trusted Publishing
# (OIDC, with provenance) and tags v$VERSION. The version is set in the CI
# workspace only; nothing is committed back. Do not add NODE_AUTH_TOKEN or an
# npm token secret.
#
# Jobs:
#   release (main only): contents: read, no id-token, checkout without
#     persisted credentials. npm ci, build, check, then prepare-release picks
#     the version and whether it still needs publishing (outputs version,
#     should_publish and should_tag). A commit that is already released
#     publishes nothing, so a re-run never publishes twice: if HEAD carries a
#     v* tag nothing else runs; if a version on npm has HEAD's SHA as its
#     gitHead (publish succeeded, tag did not) only the tag job runs.
#   publish (needs release): runs only when NPM_PUBLISH is true and
#     should_publish is true. contents: read and id-token: write, checkout
#     without persisted credentials. npm ci --ignore-scripts, sets the
#     version in the workspace with npm version, then npm publish
#     --provenance (prepack builds dist/). No git push.
#   tag (needs publish, or runs alone when should_tag is true and publish was
#     skipped as already done): contents: write, no id-token. Creates the
#     annotated tag v$VERSION at the published SHA and pushes it; succeeds if
#     the tag already points at this SHA and fails if it points anywhere else.
#
# Live publish is gated on the repository variable NPM_PUBLISH=true, so
# merging this workflow cannot publish (or fail on a missing npm package).
# Until then the release job runs the checks, reports the version it would
# publish and the other jobs are skipped.
#
# One-time bootstrap. npm can attach a Trusted Publisher only to a package
# that already exists, so the first version is published by hand:
#   (a) After this workflow is on main, a member of the @fairmint npm
#       organization runs `npm ci && npm publish --access public` from a clean
#       checkout of merged main. prepack builds dist/.
#   (b) Tag that commit: `git tag -a v0.1.0 -m "Release v0.1.0"` and
#       `git push origin v0.1.0`.
#   (c) On npmjs.com, package settings, Trusted Publisher: GitHub Actions,
#       organization Fairmint, repository eip-private-nft-media, workflow
#       filename publish.yml, environment empty.
#   (d) In GitHub, Settings > Secrets and variables > Actions > Variables, set
#       the repository variable NPM_PUBLISH=true.
# After that every push to main publishes the next patch version.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_tag: ${{ steps.release.outputs.should_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - run: npm run check

      - name: Prepare release
        id: release
        run: node scripts/prepare-release.mjs

      - name: Live publish is disabled
        if: ${{ vars.NPM_PUBLISH != 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.release.outputs.should_publish }}
        run: |
          {
            echo "## Live npm publish is disabled"
            echo
            echo "The repository variable NPM_PUBLISH is not \`true\`. This run would have published version \`$VERSION\` (should_publish=$SHOULD_PUBLISH)."
            echo
            echo "One-time bootstrap:"
            echo
            echo "1. A member of the @fairmint npm organization runs \`npm ci && npm publish --access public\` from a clean checkout of main."
            echo "2. Tag that commit \`v0.1.0\` and push the tag."
            echo "3. On npmjs.com attach a Trusted Publisher: GitHub Actions, organization Fairmint, repository eip-private-nft-media, workflow filename publish.yml, environment empty."
            echo "4. Set the repository variable NPM_PUBLISH=true."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: release
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH == 'true' && needs.release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) needs npm 11.5.1 or newer.
      - name: Install pinned npm
        run: npm install --global npm@11.18.0

      # Dependency install scripts do not run here. The package's own
      # prepack (npm run build, plain tsc) still runs on npm publish.
      - run: npm ci --ignore-scripts

      - name: Set the release version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected version '$VERSION'"; exit 1; }
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Trusted Publishing (OIDC); do not set NODE_AUTH_TOKEN.
      - name: Publish to npm
        run: npm publish --provenance --access public

  tag:
    needs: [release, publish]
    # Runs after a successful publish, or on a re-run whose release job found
    # this commit already on npm (publish skipped, should_tag true).
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.NPM_PUBLISH == 'true'
      && needs.release.result == 'success' && needs.release.outputs.should_tag == 'true'
      && (needs.publish.result == 'success'
      || (needs.publish.result == 'skipped' && needs.release.outputs.should_publish == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Tag the release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected version '$VERSION'"; exit 1; }
          tag="v$VERSION"
          commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            existing=$(git rev-parse "refs/tags/$tag^{commit}")
            if [[ "$existing" == "$commit" ]]; then
              echo "Tag $tag already points at $commit."
              exit 0
            fi
            echo "Tag $tag points at $existing, not the published commit $commit. Failing closed."
            exit 1
          fi
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "$tag" "$commit" -m "Release $tag"
          git push origin "refs/tags/$tag"
          echo "Tagged $tag at $commit" >> "$GITHUB_STEP_SUMMARY"
